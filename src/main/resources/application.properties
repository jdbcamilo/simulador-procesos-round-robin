spring.application.name=simulador-procesos

# H2 Configuration
spring.datasource.url=jdbc:h2:mem:simulador_procesos;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# File output directory for process activities
app.output-dir=./process-output

# CORS
spring.web.cors.allowed-origins=*
